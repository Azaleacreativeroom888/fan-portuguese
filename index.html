<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga em Português</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --azul: #1a3a5c;
      --azul-light: #2e6da4;
      --azul-pale: #c8ddf0;
      --creme: #f5efe6;
      --ocre: #c8955a;
      --ocre-dark: #9b6a32;
      --verde: #2d5a3d;
      --tile-white: #f0eee9;
      --text-dark: #1c1812;
      --text-mid: #4a3f35;
      --accent-gold: #d4a843;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--creme);
      color: var(--text-dark);
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      overflow-x: hidden;
    }

    /* ── AZULEJO PATTERN ── */
    .azulejo-bg {
      background-color: var(--azul);
      background-image:
        /* Cross lines */
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.08) 1px, transparent 1px),
        /* Diamond center */
        radial-gradient(ellipse 30% 30% at 50% 50%, rgba(200,221,240,0.18) 0%, transparent 60%),
        /* Corner accents */
        radial-gradient(ellipse 12% 12% at 0% 0%, rgba(200,221,240,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 12% 12% at 100% 0%, rgba(200,221,240,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 12% 12% at 0% 100%, rgba(200,221,240,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 12% 12% at 100% 100%, rgba(200,221,240,0.25) 0%, transparent 70%);
      background-size: 80px 80px;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      height: 70px;
      background: rgba(26, 58, 92, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--ocre);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 1.5rem;
      color: var(--tile-white);
      letter-spacing: 0.04em;
      text-decoration: none;
    }
    .nav-logo span { color: var(--ocre); font-style: italic; }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }
    .nav-links a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--azul-pale);
      text-decoration: none;
      position: relative;
      transition: color 0.3s;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 1px;
      background: var(--ocre);
      transition: width 0.35s ease;
    }
    .nav-links a:hover { color: var(--ocre); }
    .nav-links a:hover::after { width: 100%; }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      overflow: hidden;
    }

    .hero-left {
      background-color: var(--azul);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8rem 5rem 5rem 6rem;
      position: relative;
      z-index: 1;
    }
    .hero-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .hero-eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ocre);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      animation: fadeUp 0.8s 0.2s both;
    }
    .hero-eyebrow::before {
      content: '';
      display: inline-block;
      width: 2rem;
      height: 1px;
      background: var(--ocre);
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 5vw, 5.5rem);
      font-weight: 900;
      line-height: 1.05;
      color: var(--tile-white);
      margin-bottom: 0.3rem;
      animation: fadeUp 0.8s 0.35s both;
    }
    .hero-title em {
      font-style: italic;
      color: var(--ocre);
      display: block;
    }

    .hero-subtitle {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.1rem;
      color: var(--azul-pale);
      margin: 1.5rem 0 2.5rem;
      line-height: 1.9;
      animation: fadeUp 0.8s 0.5s both;
    }

    .hero-cta {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      animation: fadeUp 0.8s 0.65s both;
    }

    .btn-primary {
      display: inline-block;
      padding: 0.85rem 2.2rem;
      background: var(--ocre);
      color: var(--text-dark);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border: 2px solid var(--ocre);
      transition: background 0.3s, color 0.3s, transform 0.2s;
    }
    .btn-primary:hover {
      background: transparent;
      color: var(--ocre);
      transform: translateY(-2px);
    }

    .btn-secondary {
      display: inline-block;
      padding: 0.85rem 2.2rem;
      background: transparent;
      color: var(--tile-white);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(240,238,233,0.4);
      transition: border-color 0.3s, color 0.3s, transform 0.2s;
    }
    .btn-secondary:hover {
      border-color: var(--tile-white);
      transform: translateY(-2px);
    }

    /* ── HERO RIGHT: Tile panel ── */
    .hero-right {
      position: relative;
      overflow: hidden;
    }

    .tile-panel {
      width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: 3px;
      background: #0d2135;
    }

    .tile {
      background-color: var(--azul);
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.07) 1px, transparent 1px),
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(200,221,240,0.2) 0%, transparent 65%);
      background-size: 40px 40px, 40px 40px, 100% 100%;
      position: relative;
      transition: opacity 0.4s;
      opacity: 0;
      animation: tileReveal 0.5s forwards;
    }
    .tile:nth-child(odd) { animation-delay: calc(var(--i, 0) * 0.04s); }
    .tile:nth-child(even) { animation-delay: calc(var(--i, 0) * 0.05s + 0.1s); }

    .tile-manga {
      grid-column: 2 / 5;
      grid-row: 2 / 6;
      background: #0d2135;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .manga-preview-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 0.5rem;
    }

    .manga-frame {
      width: 100%; flex: 1;
      border: 2px solid rgba(200,221,240,0.3);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #091829;
    }
    .manga-frame:nth-child(1) { flex: 2; }

    .manga-frame-inner {
      text-align: center;
      color: rgba(200,221,240,0.4);
      font-family: 'Playfair Display', serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      padding: 1rem;
    }
    .manga-frame-inner .icon {
      font-size: 2rem;
      margin-bottom: 0.3rem;
      display: block;
    }

    /* ── FLOATING DECORATIONS ── */
    .deco-circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(200, 149, 90, 0.25);
      pointer-events: none;
    }
    .deco-circle-1 {
      width: 300px; height: 300px;
      bottom: -80px; right: -80px;
    }
    .deco-circle-2 {
      width: 180px; height: 180px;
      bottom: -20px; right: -20px;
    }
    .deco-line {
      position: absolute;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--ocre), transparent);
      opacity: 0.4;
    }

    /* ── SECTION BASE ── */
    section { padding: 6rem 0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 3rem; }

    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    .section-label {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ocre-dark);
      margin-bottom: 1rem;
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 3.5vw, 3.2rem);
      font-weight: 900;
      color: var(--azul);
      line-height: 1.15;
    }
    .section-title em { font-style: italic; color: var(--ocre-dark); }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem auto 0;
      width: fit-content;
    }
    .divider-line {
      width: 60px; height: 1px;
      background: var(--ocre);
      opacity: 0.6;
    }
    .divider-diamond {
      width: 8px; height: 8px;
      background: var(--ocre);
      transform: rotate(45deg);
      opacity: 0.8;
    }

    /* ── LATEST WORKS ── */
    .works-section { background: var(--creme); }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .work-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      border: 1px solid rgba(26,58,92,0.1);
      transition: transform 0.4s cubic-bezier(0.23,1,0.32,1), box-shadow 0.4s;
    }
    .work-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(26,58,92,0.12);
    }

    .work-card-image {
      aspect-ratio: 3/4;
      background: var(--azul);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .work-card-image .azulejo-bg {
      width: 100%; height: 100%;
      position: absolute;
      opacity: 0.6;
    }
    .work-card-image .vol-label {
      position: relative;
      z-index: 1;
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      font-weight: 900;
      font-style: italic;
      color: rgba(240,238,233,0.15);
      user-select: none;
    }
    .work-card-badge {
      position: absolute;
      top: 1rem; left: 1rem;
      background: var(--ocre);
      color: var(--text-dark);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.3rem 0.7rem;
      z-index: 2;
    }

    .work-card-body {
      padding: 1.3rem 1.5rem 1.6rem;
      background: white;
      border-top: 2px solid var(--azul);
    }
    .work-card-jp {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.8rem;
      color: var(--ocre-dark);
      margin-bottom: 0.3rem;
      letter-spacing: 0.05em;
    }
    .work-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--azul);
      margin-bottom: 0.6rem;
      line-height: 1.3;
    }
    .work-card-desc {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text-mid);
    }
    .work-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(0,0,0,0.06);
    }
    .work-card-chapter {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-mid);
    }
    .work-card-arrow {
      font-size: 1rem;
      color: var(--azul-light);
      transition: transform 0.3s;
    }
    .work-card:hover .work-card-arrow { transform: translateX(5px); }

    /* ── ABOUT STRIP ── */
    .about-section {
      background: var(--azul);
      position: relative;
      overflow: hidden;
    }
    .about-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .about-inner {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: center;
    }
    .about-text .section-label { color: var(--ocre); }
    .about-text .section-title { color: var(--tile-white); }
    .about-text .section-title em { color: var(--ocre); }
    .about-text p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      line-height: 1.9;
      color: var(--azul-pale);
      margin-top: 1.5rem;
    }
    .about-text .btn-primary { margin-top: 2rem; }

    .about-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5px;
      background: rgba(200,221,240,0.15);
    }
    .stat-box {
      background: rgba(26,58,92,0.8);
      padding: 2.5rem 2rem;
      text-align: center;
      transition: background 0.3s;
    }
    .stat-box:hover { background: rgba(46,109,164,0.5); }
    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 900;
      color: var(--ocre);
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .stat-label {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--azul-pale);
    }

    /* ── BLOG PREVIEW ── */
    .blog-section { background: #f0ebe2; }

    .blog-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }

    .blog-main {
      background: white;
      border: 1px solid rgba(26,58,92,0.08);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: box-shadow 0.3s;
    }
    .blog-main:hover { box-shadow: 0 10px 30px rgba(26,58,92,0.1); }

    .blog-main-image {
      height: 260px;
      background: var(--azul);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blog-main-image .azulejo-bg { position: absolute; inset: 0; }
    .blog-main-image-text {
      position: relative;
      z-index: 1;
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-style: italic;
      color: rgba(240,238,233,0.5);
      text-align: center;
      padding: 1rem;
    }

    .blog-main-body { padding: 2rem; }
    .blog-tag {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ocre-dark);
      border: 1px solid var(--ocre);
      padding: 0.2rem 0.6rem;
      margin-bottom: 0.8rem;
    }
    .blog-main-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--azul);
      margin-bottom: 0.8rem;
      line-height: 1.3;
    }
    .blog-main-excerpt {
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--text-mid);
    }
    .blog-main-date {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: #999;
    }

    .blog-side { display: flex; flex-direction: column; gap: 1rem; }
    .blog-mini {
      background: white;
      border: 1px solid rgba(26,58,92,0.08);
      padding: 1.4rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      transition: box-shadow 0.3s;
    }
    .blog-mini:hover { box-shadow: 0 5px 20px rgba(26,58,92,0.08); }
    .blog-mini-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ocre);
      flex-shrink: 0;
      margin-top: 0.45rem;
    }
    .blog-mini-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--azul);
      margin-bottom: 0.3rem;
      line-height: 1.35;
    }
    .blog-mini-date { font-size: 0.75rem; color: #aaa; letter-spacing: 0.08em; }

    /* ── GALLERY STRIP ── */
    .gallery-strip {
      background: var(--azul);
      padding: 3rem 0;
      overflow: hidden;
      position: relative;
    }
    .gallery-strip-label {
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ocre);
      margin-bottom: 1.5rem;
    }
    .gallery-scroll {
      display: flex;
      gap: 3px;
      animation: scrollX 30s linear infinite;
      width: max-content;
    }
    .gallery-tile {
      width: 140px; height: 100px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .gallery-tile .azulejo-bg {
      width: 100%; height: 100%;
      position: absolute;
    }
    .gallery-tile-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.7rem;
      color: rgba(240,238,233,0.3);
    }

    /* ── CONTACT ── */
    .contact-section { background: var(--creme); }
    .contact-inner {
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }
    .contact-inner p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--text-mid);
      margin: 1.5rem 0 2.5rem;
    }
    .contact-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    /* ── FOOTER ── */
    footer {
      background: #0d2135;
      padding: 2.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(200,221,240,0.15);
    }
    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 1.2rem;
      color: var(--tile-white);
      letter-spacing: 0.04em;
    }
    .footer-logo span { color: var(--ocre); font-style: italic; }
    .footer-copy {
      font-size: 0.8rem;
      color: rgba(200,221,240,0.4);
      letter-spacing: 0.08em;
    }
    .footer-nav {
      display: flex;
      gap: 1.8rem;
    }
    .footer-nav a {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(200,221,240,0.5);
      text-decoration: none;
      transition: color 0.3s;
    }
    .footer-nav a:hover { color: var(--ocre); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes tileReveal {
      to { opacity: 1; }
    }
    @keyframes scrollX {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .hero-right { display: none; }
      .hero-left { padding: 8rem 2rem 4rem; }
      .works-grid { grid-template-columns: 1fr 1fr; }
      .about-inner { grid-template-columns:
